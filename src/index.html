<!doctype html>
<html lang="vi" data-theme="dark" data-accent="violet">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' data:;"
    />
    <title>Daily Quest</title>

    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/themes.css" />
    <link rel="stylesheet" href="./styles/pages.css" />
  </head>
  <body>
    <div id="app" class="app">
      <!-- ===== Custom titlebar (frameless) ===== -->
      <header class="titlebar" id="titlebar">
        <div class="titlebar__brand">
          <span class="titlebar__dot" aria-hidden="true"></span>
          <span class="titlebar__name">Daily Quest</span>
        </div>
        <div class="titlebar__spacer"></div>
        <div class="titlebar__controls" id="winControls">
          <button class="winbtn winbtn--mini" id="winMini" type="button" aria-label="Thu gọn thành hiệp sĩ" title="Chế độ hiệp sĩ (mini)">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 3l7 2.5V11c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V5.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 8v6M9.5 10.5l2.5 2.5 2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="winbtn" id="winMin" type="button" aria-label="Minimize">
            <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
          <button class="winbtn" id="winMax" type="button" aria-label="Maximize">
            <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="1.6" y="1.6" width="8.8" height="8.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <button class="winbtn winbtn--close" id="winClose" type="button" aria-label="Close">
            <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <div class="shell">
        <!-- ===== Sidebar ===== -->
        <aside class="sidebar" id="sidebar">
          <div class="sidebar__brand">
            <span class="brand__logo" aria-hidden="true">
              <svg viewBox="0 0 32 32" width="30" height="30">
                <defs>
                  <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#5b8cff" />
                    <stop offset="1" stop-color="#22d3ee" />
                  </linearGradient>
                </defs>
                <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#brandGrad)" />
                <path d="M11 21l10-10M20 10l1.6 1.6-8 8-3 .8.8-3z" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="brand__text">Daily Quest</span>
          </div>

          <nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>

          <div class="sidebar__footer">
            <button class="icon-btn" id="collapseBtn" type="button" aria-label="Thu gọn menu">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </aside>

        <!-- ===== Main column ===== -->
        <main class="main">
          <header class="topbar" id="topbar">
            <div class="topbar__heading">
              <h1 class="topbar__title" id="pageTitle">Dashboard</h1>
              <p class="topbar__subtitle" id="pageSubtitle">Chào mừng trở lại!</p>
            </div>
            <div class="topbar__stats" id="topStats"></div>
          </header>

          <section class="view" id="view" tabindex="-1"></section>
        </main>
      </div>
    </div>

    <!-- ===== Overlay layers ===== -->
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
    <div id="modalRoot"></div>

    <div id="palette" class="palette" hidden>
      <div class="palette__panel" role="dialog" aria-label="Command palette">
        <div class="palette__search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="paletteInput" type="text" placeholder="Nhập lệnh hoặc tìm quest..." autocomplete="off" spellcheck="false" />
          <kbd class="palette__esc">Esc</kbd>
        </div>
        <ul class="palette__list" id="paletteList" role="listbox"></ul>
      </div>
    </div>

    <div id="levelup" class="levelup" hidden>
      <div class="levelup__card">
        <div class="levelup__badge" id="levelupLevel">12</div>
        <div class="levelup__title">LEVEL UP!</div>
        <div class="levelup__sub" id="levelupSub">Bạn đã đạt cấp độ mới</div>
      </div>
    </div>

    <div id="combo" class="combo-hud" hidden>
      <span class="combo-hud__x">x</span><span class="combo-hud__n" id="comboN">2</span>
      <span class="combo-hud__label">COMBO</span>
    </div>

    <canvas id="fx" class="fx-canvas" aria-hidden="true"></canvas>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
