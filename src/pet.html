<!doctype html>
<html lang="vi" data-theme="dark" data-accent="violet">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;"
    />
    <title>Daily Quest Mini</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/themes.css" />
    <link rel="stylesheet" href="./styles/pet.css" />
    <link rel="stylesheet" href="./styles/hero.css" />
  </head>
  <body class="pet-body">
    <div class="pet-root">
      <!-- Panel to-do mo, dung ben phai man hinh -->
      <section class="flyout" id="flyout" hidden aria-label="To-do nhanh">
        <div class="flyout__head">
          <span class="flyout__title">To-do</span>
          <span class="flyout__count" id="flyCount">0</span>
        </div>
        <ul class="flyout__list" id="flyList"></ul>
        <div class="flyout__add">
          <input id="flyInput" type="text" placeholder="Thêm việc… ⏎" autocomplete="off" spellcheck="false" />
        </div>
        <div class="flyout__foot">
          <button class="pf-btn pf-btn--primary" id="btnOpen">Mở app</button>
          <button class="pf-btn" id="btnClose">Đóng</button>
        </div>
      </section>

      <!-- Anh hung dong hanh (JS ve tuong theo hero dang chon) -->
      <div class="knight" id="knight" role="button" tabindex="0" aria-label="Hero - bấm để mở to-do" title="Bấm để SMASH & mở To-do">
        <div class="knight__platform"></div>
        <div class="pet-hero" id="petHero"></div>
        <div class="slash" id="slash" aria-hidden="true"></div>
        <div class="knight__badge" id="knightBadge" hidden>0</div>
      </div>
    </div>
    <script type="module" src="./js/pet.js"></script>
  </body>
</html>
